<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتال مهمان | ثبت درخواست مهمانی</title>
    <!-- فونت و تیلویند -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استایل و اسکریپت تقویم شمسی -->
    <link rel="stylesheet" href="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.css">
    <script type="text/javascript" src="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.js"></script>
    <!-- تبدیل شمسی به میلادی -->
    <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
        jdp-container { z-index: 9999 !important; }
        .slot-pill { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-gray-800">

    <div class="bg-white w-full max-w-lg rounded-3xl shadow-sm border border-slate-100 p-8 sm:p-10 relative overflow-hidden">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-md shadow-slate-200">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-slate-900 mb-2">خوشحال می‌شیم ببینیمتون!</h1>
            <p class="text-sm text-slate-500 leading-relaxed">جهت هماهنگی و پذیرایی هرچه بهتر، زمان مورد نظرتان را مشخص فرمایید.</p>
        </div>

        <!-- باکس نمایش پیام -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border text-center transition-all duration-300"></div>

        <form id="visitForm" class="space-y-5">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">نام و نام خانوادگی <span class="text-rose-500">*</span></label>
                    <input type="text" id="guest_name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none transition-all text-sm" placeholder="مثلاً: علی احمدی">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">شماره همراه <span class="text-rose-500">*</span></label>
                    <input type="tel" id="guest_phone" required pattern="^09[0-9]{9}$" maxlength="11" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-left focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none transition-all text-sm font-mono placeholder-slate-400" placeholder="09123456789" dir="ltr">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">تاریخ حضور (شمسی) <span class="text-rose-500">*</span></label>
                    <input type="text" id="visit_date" data-jdp required readonly class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none cursor-pointer text-center text-sm font-medium" placeholder="انتخاب از تقویم">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">ساعت ورود <span class="text-rose-500">*</span></label>
                    <input type="time" id="visit_time" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none text-center text-sm font-medium">
                </div>
            </div>

            <!-- اسلات‌های پیشنهادی و خالی (داینامیک) -->
            <div id="slotsContainer" class="hidden bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-slate-600">ساعت‌های پیشنهادی برای این روز:</span>
                    <span id="slotsLoading" class="hidden text-xs text-slate-400 animate-pulse">در حال بررسی...</span>
                </div>
                <div id="slotsPills" class="flex flex-wrap gap-2"></div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">مدت زمان تقریبی حضور</label>
                <select id="duration_hours" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none text-sm">
                    <option value="1">۱ ساعت (یک چای و گفت‌وگوی کوتاه)</option>
                    <option value="2" selected>۲ ساعت (عصرانه / دورهمی معمول)</option>
                    <option value="3">۳ ساعت (شام و دورهمی خانوادگی)</option>
                    <option value="4">۴ ساعت (ناهار یا مهمانی طولانی‌تر)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">مناسبت یا یادداشت اختیاری</label>
                <input type="text" id="purpose" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none text-sm placeholder-slate-400" placeholder="مثلاً: تبریک موفقیت، دلتنگی...">
            </div>

            <!-- اطلاعیه زمان بافر -->
            <div class="flex items-center gap-2 text-xs text-slate-500 bg-amber-50/70 p-3 rounded-xl border border-amber-100/80">
                <svg class="w-4 h-4 text-amber-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>جهت آرامش و پذیرایی شایسته، حداقل ۳۰ دقیقه زمان استراحت بین مهمانی‌ها منظور می‌گردد.</span>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl hover:bg-slate-800 transition-all shadow-lg shadow-slate-200 active:scale-[0.99] text-sm">
                ثبت درخواست مهمانی
            </button>
        </form>

        <div class="mt-8 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
            سیستم هوشمند مدیریت مهمان خانواده
        </div>
    </div>

    <script>
        // آدرس پایه داینامیک API
        const API_BASE = (window.location.port === '8000' || window.location.pathname.startsWith('/api'))
            ? '' 
            : 'https://guest-managment-app.onrender.com/api/visits/';

        // تبدیل اعداد فارسی و عربی به انگلیسی
        function toEnglishDigits(str) {
            if (!str) return '';
            const fa = '۰۱۲۳۴۵۶۷۸۹';
            const ar = '٠١٢٣٤٥٦٧٨٩';
            let res = String(str);
            for (let i = 0; i < 10; i++) {
                res = res.replaceAll(fa[i], i).replaceAll(ar[i], i);
            }
            return res;
        }

        // تبدیل خودکار شماره موبایل هنگام تایپ یا Paste
        const phoneInput = document.getElementById('guest_phone');
        phoneInput.addEventListener('input', (e) => {
            e.target.value = toEnglishDigits(e.target.value).replace(/[^0-9]/g, '');
        });

        // راه‌اندازی تقویم شمسی
        jalaliDatepicker.startWatch({
            minDate: "today",
            time: false,
            showEmptyBtn: false
        });

        // بررسی و پیشنهاد اسلات‌های خالی به محض انتخاب تاریخ
        const visitDateInput = document.getElementById('visit_date');
        const slotsContainer = document.getElementById('slotsContainer');
        const slotsPills = document.getElementById('slotsPills');
        const slotsLoading = document.getElementById('slotsLoading');

        visitDateInput.addEventListener('change', async function() {
            const jDateStr = this.value;
            if (!jDateStr) return;

            slotsContainer.classList.remove('hidden');
            slotsLoading.classList.remove('hidden');
            slotsPills.innerHTML = '';

            try {
                const jParts = toEnglishDigits(jDateStr).split('/');
                const gDate = jalaali.toGregorian(parseInt(jParts[0]), parseInt(jParts[1]), parseInt(jParts[2]));
                const gDateStr = `${gDate.gy}-${String(gDate.gm).padStart(2, '0')}-${String(gDate.gd).padStart(2, '0')}`;
                const duration = document.getElementById('duration_hours').value || 2;

                const res = await fetch(`https://guest-managment-app.onrender.com/api/available-slots/?date=${gDateStr}&duration=${duration}`);
                if (res.ok) {
                    const data = await res.json();
                    renderSlots(data.slots);
                }
            } catch (e) {
                console.log('Error fetching slots:', e);
            } finally {
                slotsLoading.classList.add('hidden');
            }
        });

        function renderSlots(slots) {
            slotsPills.innerHTML = '';
            if (!slots || slots.length === 0) {
                slotsPills.innerHTML = '<span class="text-xs text-slate-400">ساعتی یافت نشد.</span>';
                return;
            }

            slots.forEach(slot => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'slot-pill text-xs px-3 py-1.5 rounded-lg border font-medium flex items-center gap-1.5 ';

                if (slot.is_available) {
                    btn.className += 'bg-white border-slate-200 text-slate-700 hover:border-slate-900 hover:bg-slate-900 hover:text-white cursor-pointer';
                    btn.innerHTML = `<span>${slot.time}</span>`;
                    btn.onclick = () => {
                        document.getElementById('visit_time').value = slot.time;
                        // هایلایت اسلات انتخاب شده
                        document.querySelectorAll('.slot-pill').forEach(p => p.classList.remove('ring-2', 'ring-slate-900', 'bg-slate-900', 'text-white'));
                        btn.classList.add('ring-2', 'ring-slate-900', 'bg-slate-900', 'text-white');
                    };
                } else {
                    btn.className += 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed opacity-60';
                    btn.title = slot.reason;
                    btn.innerHTML = `<span class="line-through">${slot.time}</span><span class="text-[10px]">(${slot.reason})</span>`;
                    btn.disabled = true;
                }
                slotsPills.appendChild(btn);
            });
        }

        // ارسال فرم
        document.getElementById('visitForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'در حال ثبت...';
            alertBox.classList.add('hidden');
            alertBox.className = 'mb-6 p-4 rounded-xl text-sm font-medium border text-center transition-all duration-300 hidden';

            const jDateStr = toEnglishDigits(document.getElementById('visit_date').value);
            const timeStr = toEnglishDigits(document.getElementById('visit_time').value);

            if (!jDateStr || !timeStr) {
                alertBox.innerText = 'لطفاً تاریخ و ساعت حضور را مشخص فرمایید.';
                alertBox.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200');
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = 'ثبت درخواست مهمانی';
                return;
            }

            // تبدیل شمسی به ایزو میلادی
            const jParts = jDateStr.split('/');
            const gDate = jalaali.toGregorian(parseInt(jParts[0]), parseInt(jParts[1]), parseInt(jParts[2]));
            const isoString = `${gDate.gy}-${String(gDate.gm).padStart(2, '0')}-${String(gDate.gd).padStart(2, '0')}T${timeStr}:00`;

            const payload = {
                guest_name: document.getElementById('guest_name').value.trim(),
                guest_phone: toEnglishDigits(document.getElementById('guest_phone').value.trim()),
                requested_start: isoString, 
                duration_hours: parseInt(document.getElementById('duration_hours').value),
                purpose: document.getElementById('purpose').value.trim()
            };

            try {
                const response = await fetch(`${API_BASE}/api/visits/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    alertBox.innerHTML = `
                        <div class="flex flex-col items-center gap-1.5">
                            <span class="font-bold text-emerald-900">درخواست شما با موفقیت ثبت گردید!</span>
                            <span class="text-xs text-emerald-700">نتیجه بررسی به زودی از طریق پیامک برای شما ارسال خواهد شد.</span>
                        </div>
                    `;
                    alertBox.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
                    alertBox.classList.remove('hidden');
                    document.getElementById('visitForm').reset();
                    slotsContainer.classList.add('hidden');
                } else {
                    let errorText = 'خطا در ثبت درخواست.';
                    if (typeof result === 'object') {
                        const firstKey = Object.keys(result)[0];
                        const val = result[firstKey];
                        errorText = Array.isArray(val) ? val[0] : (typeof val === 'string' ? val : JSON.stringify(val));
                    }
                    alertBox.innerText = errorText;
                    alertBox.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200');
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                alertBox.innerText = 'خطا در برقراری ارتباط با سرور. لطفاً از اتصال اینترنت یا فعال بودن سرور مطمئن شوید.';
                alertBox.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200');
                alertBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'ثبت درخواست مهمانی';
                alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    </script>
</body>
</html>
